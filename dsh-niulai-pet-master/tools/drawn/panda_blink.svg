  <ellipse cx="48" cy="196" rx="20" ry="38" fill="#453D3F" transform="rotate(20 48 196)"/>
  <ellipse cx="252" cy="196" rx="20" ry="38" fill="#453D3F" transform="rotate(-20 252 196)"/>
