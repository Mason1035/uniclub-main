  <ellipse cx="186" cy="132" rx="21" ry="27" fill="#453D3F" transform="rotate(-16 186 132)"/>
  <!-- 鼻子 -->
  <path d="M141 156 Q150 150 159 156 Q157 167 150 169 Q143 167 141 156 Z" fill="#37302F"/>
