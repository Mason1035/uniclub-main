  <line x1="241.2" y1="194.9" x2="256.8" y2="189.1" stroke="#5FA352" stroke-width="3" stroke-linecap="round"/>
  <line x1="248.3" y1="219.5" x2="263.9" y2="213.7" stroke="#5FA352" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="232" cy="152" rx="13" ry="6.5" fill="#79BE66" transform="rotate(-38 232 152)"/>
  <ellipse cx="250" cy="156" rx="11" ry="5.5" fill="#79BE66" transform="rotate(18 250 156)"/>
  <!--EYES-->
  <path d="M104 133 Q117 117 130 133" fill="none" stroke="#FDFBF6" stroke-width="5" stroke-linecap="round"/>
  <path d="M170 133 Q183 117 196 133" fill="none" stroke="#FDFBF6" stroke-width="5" stroke-linecap="round"/>
