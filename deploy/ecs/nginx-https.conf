server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 47.95.157.51;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/classhub-acme;
        try_files $uri =404;
    }
    location / { return 308 https://47.95.157.51$request_uri; }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name 47.95.157.51;
    ssl_certificate /etc/letsencrypt/live/classhub-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/classhub-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ClassHubTLS:5m;
    root /opt/classhub/current/dist;
    index index.html;
    client_max_body_size 10m;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
    gzip_min_length 1024;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/classhub-acme;
        try_files $uri =404;
    }

    # BEGIN CLASSHUB SOCIAL UPLOAD
    location ~ ^/api/social/posts(?:/|$) {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        client_max_body_size 251m;
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
    # END CLASSHUB SOCIAL UPLOAD

    location /api/ {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
    location /uploads/ {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        proxy_pass http://127.0.0.1:5050;
        proxy_set_header Host $host;
    }
    # BEGIN CLASSHUB PERFORMANCE
    location ~ "^/(?:fonts/classhub|branding)/[^/]+[.-][a-f0-9]{10}\.(?:woff2|webp|png|css|js)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    # END CLASSHUB PERFORMANCE

    location /static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /pet-assets/ {
        try_files $uri =404;
        expires 1h;
    }

    location ~ /\. {
        deny all;
    }

    # BEGIN CLASSHUB SEO
    # Only the anonymous public pages are rendered/indexable. No crawler-specific
    # user-agent handling, credentials or member content are involved.
    # Only return directives here: normalize mixed case before location lookup,
    # which can itself be case-insensitive on development macOS filesystems.
    if ($uri ~ "^/(?!privacy/?$)[pP][rR][iI][vV][aA][cC][yY]/?$") {
        return 308 /privacy$is_args$args;
    }
    if ($uri ~ "^/(?!about/?$)[aA][bB][oO][uU][tT]/?$") {
        return 308 /about$is_args$args;
    }
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    location = /privacy {
        try_files /privacy.html /index.html =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    location = /about {
        try_files /about.html /index.html =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    location = /privacy/ { return 308 /privacy$is_args$args; }
    location = /about/ { return 308 /about$is_args$args; }
    location = /index.html {
        add_header Cache-Control "no-cache";
        return 308 /$is_args$args;
    }
    location = /privacy.html { return 308 /privacy$is_args$args; }
    location = /about.html { return 308 /about$is_args$args; }
    location = /app.html { internal; }
    location = /404.html {
        internal;
        try_files /404.html /index.html =404;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    location = /robots.txt {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    location = /sitemap.xml {
        default_type application/xml;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    location ~* "^/(?:auth|settings|saved-posts|notifications|debug|news|announcements|events|social|functions(?:/random-call)?|quantification|fees|resources|admin(?:/(?:roster|members|events(?:/[a-fA-F0-9]{24})?|news|resources|gallery|notifications|ai|quantification|fees))?|(?:article|news|event|events|past-events|resource)/[a-fA-F0-9]{24}|comments/(?:news|event|resource|social)/[a-fA-F0-9]{24})/?$" {
        # index.html is a safe compatibility fallback during activation/rollback
        # of a release built before the public-only prerender step existed.
        try_files /app.html /index.html =404;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    location @classhub_not_found {
        error_page 404 =404 /404.html;
        return 404;
    }
    location / {
        # Existing static assets continue to work. Unknown app routes no longer
        # return the homepage with HTTP 200 (soft 404).
        try_files $uri @classhub_not_found;
    }
    # END CLASSHUB SEO
}

