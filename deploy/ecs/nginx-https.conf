server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 47.95.157.51;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/classhub-acme;
        try_files $uri =404;
    }
    location / { return 308 https://47.95.157.51$request_uri; }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 47.95.157.51;
    ssl_certificate /etc/letsencrypt/live/classhub-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/classhub-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ClassHubTLS:5m;
    root /opt/classhub/current/dist;
    index index.html;
    client_max_body_size 10m;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/classhub-acme;
        try_files $uri =404;
    }

    # BEGIN CLASSHUB SOCIAL UPLOAD
    location ~ ^/api/social/posts(?:/|$) {
        client_max_body_size 251m;
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
    # END CLASSHUB SOCIAL UPLOAD

    location /api/ {
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
    location /uploads/ {
        proxy_pass http://127.0.0.1:5050;
        proxy_set_header Host $host;
    }
    location /static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /pet-assets/ {
        try_files $uri =404;
        expires 1h;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location ~ /\. {
        deny all;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}

