# Independent classroom exhibition; loaded only in the csrg3b.top application server.
location = /temp {
    return 308 /temp/$is_args$args;
}
location ^~ /temp/ {
    root /opt/classhub/temp/current;
    index index.html;
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
}
